name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    # 注意：必须用字符串的 .Replace() 做字面量替换，不能用 -replace。
    # -replace 的模式是正则，标记里的 "If(" 会被当成分组而匹配失败（曾导致 Secret 全部静默注入失败）；
    # 且 Secret 值含 "$2a$10$..." 这类 "$n"，在正则替换串里会被当成分组引用。
    - name: Replace
      env:
        MS_CLIENT_ID_VALUE: ${{ secrets.CLIENT_ID }}
        CURSEFORGE_API_KEY_VALUE: ${{ secrets.CURSEFORGE_API_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        function Set-Marker {
          param([string]$Path, [string]$Old, [string]$New)
          $full = Join-Path $PWD.Path $Path
          $text = [IO.File]::ReadAllText($full)
          if (-not $text.Contains($Old)) { throw "未找到注入标记（文件已被改动？）：$Path`n$Old" }
          [IO.File]::WriteAllText($full, $text.Replace($Old, $New))
          Write-Host "已注入：$Path"
        }
        $msClientId = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")'
        Set-Marker "Plain Craft Launcher 2\Modules\ModSecret.vb" $msClientId $msClientId.Replace('""', '"' + $env:MS_CLIENT_ID_VALUE + '"')
        $cfKey = 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")'
        Set-Marker "Plain Craft Launcher 2\Modules\ModSecret.vb" $cfKey $cfKey.Replace('""', '"' + $env:CURSEFORGE_API_KEY_VALUE + '"')
        $commitHash = 'Public Const CommitHash As String = ""'
        Set-Marker "Plain Craft Launcher 2\Modules\Base\ModBase.vb" $commitHash $commitHash.Replace('""', '"${{ github.sha }}"')
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
